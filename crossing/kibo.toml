[project]
definitions = "definitions"
infrastructure = "crossing"

[generator]
templates = "2"
manifests = ["../templates/features.json"]

[target.cpp]
features = ["TestApp"]
output = "cpp/generated"
clean = true

[target.python]
features = ["Base", "DatabaseAttachments", "CommitAttachments", "Pool", "PoolRemote", "AttachmentPool", "AttachmentPoolRemote", "Wheel"]
output = "python/generated"

[target.typescript]
features = ["Base", "DatabaseAttachments", "CommitAttachments", "PoolRemote", "AttachmentPoolRemote", "Package"]
output = "typescript/generated"
