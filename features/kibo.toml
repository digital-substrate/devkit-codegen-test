[project]
definitions = "all.dsm"
infrastructure = "features"

[generator]
templates = "2"
manifests = ["../templates/features.json"]

[target.cpp]
features = ["TestApp", "TestBridges"]
output = "cpp/generated"
clean = true

[target.python]
features = ["Base", "Attachments", "Pool", "Wheel"]  # Attachments brings Paths, which brings Fields
output = "python/generated"

[target.typescript]
features = ["Base", "Attachments", "Pool", "Package"]  # Attachments brings Paths, which brings Fields
output = "typescript/generated"
