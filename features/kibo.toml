[project]
definitions = "all.dsm"
infrastructure = "features"

[generator]
templates = "2"
manifests = ["../templates/features.json"]

[target.cpp]
features = ["TestApp", "TestBridges"]
output = "cpp/generated"
clean = true

[target.python]
features = ["Base", "DatabaseAttachments", "CommitAttachments", "Pool", "PoolRemote", "AttachmentPool", "AttachmentPoolRemote", "Wheel"]  # CommitAttachments brings Paths, which brings Fields
output = "python/generated"

[target.typescript]
features = ["Base", "DatabaseAttachments", "CommitAttachments", "PoolRemote", "AttachmentPoolRemote", "Package"]  # CommitAttachments brings Paths, which brings Fields
output = "typescript/generated"
